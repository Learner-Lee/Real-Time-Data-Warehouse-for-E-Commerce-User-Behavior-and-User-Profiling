<svg xmlns="http://www.w3.org/2000/svg" width="680" height="736" viewBox="0 0 680 736" role="img">
<title>电商用户行为实时数仓架构</title>
<desc>回放器写入 Kafka 和 MySQL；Flink SQL、Flink CDC、Java DataStream 三条链路处理后写入 Doris，最后支撑大屏和对账。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .label { fill: #73726c; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .head { fill: none; stroke: #73726c; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray text { fill: #2C2C2A; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text { fill: #085041; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #3C3489; }
  @media (prefers-color-scheme: dark) {
    .label { fill: #B4B2A9; }
    .arr, .head { stroke: #B4B2A9; }
    .c-gray rect { fill: #444441; stroke: #B4B2A9; }
    .c-gray text { fill: #F1EFE8; }
    .c-teal rect { fill: #085041; stroke: #5DCAA5; }
    .c-teal text { fill: #E1F5EE; }
    .c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple text { fill: #EEEDFE; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>

<text class="ts label" x="40" y="68" dominant-baseline="central">数据源</text>
<text class="ts label" x="40" y="164" dominant-baseline="central">接入</text>
<text class="ts label" x="40" y="260" dominant-baseline="central">计算</text>
<text class="ts label" x="40" y="356" dominant-baseline="central">中转</text>
<text class="ts label" x="40" y="452" dominant-baseline="central">计算</text>
<text class="ts label" x="40" y="548" dominant-baseline="central">服务</text>
<text class="ts label" x="40" y="644" dominant-baseline="central">应用</text>

<g class="c-gray"><rect x="100" y="40" width="536" height="56" rx="8" stroke-width="0.8"/><text class="th" x="368" y="60" text-anchor="middle" dominant-baseline="central">回放器（Python）</text><text class="ts" x="368" y="78" text-anchor="middle" dominant-baseline="central">按事件时间回放，注入乱序 / 迟到 / 退款</text></g>
