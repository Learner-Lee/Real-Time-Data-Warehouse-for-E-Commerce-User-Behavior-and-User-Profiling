<g class="c-teal"><rect x="240" y="136" width="396" height="56" rx="8" stroke-width="0.8"/><text class="th" x="438" y="156" text-anchor="middle" dominant-baseline="central">Kafka · ods_user_behavior</text><text class="ts" x="438" y="174" text-anchor="middle" dominant-baseline="central">行为日志，3 分区，幂等生产</text></g>
