<line x1="578" y1="192" x2="578" y2="230" class="arr" marker-end="url(#arrow)"/>
<path d="M636 164 H656 V452 H638" class="arr dash" marker-end="url(#arrow)"/>
<text class="ts label" x="668" y="308" text-anchor="middle" dominant-baseline="central" transform="rotate(90 668 308)">ODS 明细（对账用）</text>

