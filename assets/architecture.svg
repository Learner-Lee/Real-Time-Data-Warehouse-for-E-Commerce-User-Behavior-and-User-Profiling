<g class="c-purple"><rect x="240" y="232" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="298" y="252" text-anchor="middle" dominant-baseline="central">Flink SQL DWD</text><text class="ts" x="298" y="270" text-anchor="middle" dominant-baseline="central">清洗 + 关联维表</text></g>
<g class="c-teal"><rect x="380" y="232" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="438" y="252" text-anchor="middle" dominant-baseline="central">HBase 维表</text><text class="ts" x="438" y="270" text-anchor="middle" dominant-baseline="central">加盐 rowkey</text></g>
<g class="c-purple"><rect x="520" y="232" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="578" y="252" text-anchor="middle" dominant-baseline="central">DataStream</text><text class="ts" x="578" y="270" text-anchor="middle" dominant-baseline="central">迟到 + 侧输出</text></g>
<line x1="378" y1="260" x2="358" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="298" y1="288" x2="298" y2="326" class="arr" marker-end="url(#arrow)"/>
<line x1="578" y1="288" x2="578" y2="326" class="arr" marker-end="url(#arrow)"/>
<line x1="158" y1="288" x2="158" y2="518" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="240" y="328" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="298" y="348" text-anchor="middle" dominant-baseline="central">Kafka dwd</text><text class="ts" x="298" y="366" text-anchor="middle" dominant-baseline="central">事务写，读已提交</text></g>
<g class="c-teal"><rect x="520" y="328" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="578" y="348" text-anchor="middle" dominant-baseline="central">Kafka 结果</text><text class="ts" x="578" y="366" text-anchor="middle" dominant-baseline="central">窗口结果 / 迟到</text></g>
