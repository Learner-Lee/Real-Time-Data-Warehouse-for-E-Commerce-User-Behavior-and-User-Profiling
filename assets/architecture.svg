<line x1="578" y1="384" x2="578" y2="422" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="240" y="424" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="298" y="444" text-anchor="middle" dominant-baseline="central">Flink SQL DWS</text><text class="ts" x="298" y="462" text-anchor="middle" dominant-baseline="central">1 分钟窗口 + UV</text></g>
<g class="c-purple"><rect x="520" y="424" width="116" height="56" rx="8" stroke-width="0.8"/><text class="th" x="578" y="444" text-anchor="middle" dominant-baseline="central">Routine Load</text><text class="ts" x="578" y="462" text-anchor="middle" dominant-baseline="central">Kafka 导入 Doris</text></g>
<line x1="298" y1="480" x2="298" y2="518" class="arr" marker-end="url(#arrow)"/>
<line x1="578" y1="480" x2="578" y2="518" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="100" y="520" width="536" height="56" rx="8" stroke-width="0.8"/><text class="th" x="368" y="540" text-anchor="middle" dominant-baseline="central">Doris · r1_dw</text><text class="ts" x="368" y="558" text-anchor="middle" dominant-baseline="central">交易 / 流量 / BITMAP UV / 迟到明细 / ODS 明细</text></g>
<line x1="368" y1="576" x2="368" y2="614" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="100" y="616" width="536" height="56" rx="8" stroke-width="0.8"/><text class="th" x="368" y="636" text-anchor="middle" dominant-baseline="central">大屏 + 对账</text><text class="ts" x="368" y="654" text-anchor="middle" dominant-baseline="central">PV/UV、漏斗、GMV；流 + 迟到 = 离线重算</text></g>

<text class="ts label" x="100" y="700" dominant-baseline="central">紫色：计算作业　青色：消息队列 / 存储　灰色：数据源与应用</text>
<text class="ts label" x="100" y="720" dominant-baseline="central">虚线：ODS 明细直接导入 Doris，用来离线重算、和实时结果对账</text>
</svg>
