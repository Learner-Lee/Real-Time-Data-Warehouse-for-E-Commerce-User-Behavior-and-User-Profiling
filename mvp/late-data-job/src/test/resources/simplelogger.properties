# 测试时只输出 WARN 及以上
org.slf4j.simpleLogger.defaultLogLevel=warn

# 本地 MiniCluster 模式下的已知无害警告，调到 ERROR：
# - CollectResultFetcher：测试用 executeAndCollect 收结果，作业结束后本地集群先关闭，收尾时查不到作业状态（结果已完整读到）
# - DefaultDelegationTokenManager / WebMonitorUtils：本地没有 Kerberos 和日志文件配置
# - MetricUtils：算子链的名字超过 80 个字符被截断
org.slf4j.simpleLogger.log.org.apache.flink.streaming.api.operators.collect.CollectResultFetcher=error
org.slf4j.simpleLogger.log.org.apache.flink.runtime.security.token.DefaultDelegationTokenManager=error
org.slf4j.simpleLogger.log.org.apache.flink.runtime.webmonitor.WebMonitorUtils=error
org.slf4j.simpleLogger.log.org.apache.flink.runtime.metrics.util.MetricUtils=error
