# Grafana 数据源：Doris 兼容 MySQL 协议，所以直接用 Grafana 自带的 MySQL 数据源连 FE 的查询端口 9030
# Doris 的 DATETIME 不带时区，驱动按 UTC 解析；大屏的时区也设成 UTC，显示出来就是 Doris 里存的北京时间
apiVersion: 1

datasources:
  - name: Doris r1_dw
    uid: doris-r1
    type: mysql
    access: proxy
    url: "@VM_HOST@:9030"
    user: root
    database: r1_dw
    isDefault: true
    editable: false
    jsonData:
      database: r1_dw
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ""
