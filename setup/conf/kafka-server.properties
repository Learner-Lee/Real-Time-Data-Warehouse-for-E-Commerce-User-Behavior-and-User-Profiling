# R1：单节点 KRaft 模式，同一个进程既是 broker 也是 controller，不需要 ZooKeeper
# 基于 Kafka 4.3.2 自带的 config/server.properties 修改；@...@ 由 02-kafka.sh 替换

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=@VM_HOST@:9093

# 监听所有网卡，对外公布主机名（Flink、Python 脚本都通过 @VM_HOST@:9092 连接）
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://@VM_HOST@:9092,CONTROLLER://@VM_HOST@:9093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log.dirs=@DATA_DIR@/kafka/logs
# 默认 3 个分区，方便练习多并行度消费
num.partitions=3
num.recovery.threads.per.data.dir=2

# 单节点只能 1 个副本
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# 练习环境磁盘小：数据保留 2 天，每个分区最多 5GB
log.retention.hours=48
log.retention.bytes=5368709120
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Flink 两阶段提交写 Kafka 时，事务可能持续较久：把 broker 允许的最长事务时间从默认 15 分钟调到 1 小时
transaction.max.timeout.ms=3600000
